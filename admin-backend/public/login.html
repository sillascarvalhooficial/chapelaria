<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Ateliê | Login</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Painel do Ateliê</h1>
    <p class="sub">Entre para editar o site, os serviços e o mural de achados.</p>
    <div id="erroBox"></div>
    <form id="formLogin">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p class="credenciais-padrao">Login padrão de demonstração: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
